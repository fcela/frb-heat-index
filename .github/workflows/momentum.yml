# Weekly refresh of the Pulse of the Market dataset (leading
# indicators, fingerprint states, rotation).
#
# Schedule: Mondays 06:30 UTC, aligned with the weekly market-pulse
# update (pulse.yml runs Mondays 06:00 UTC; the half-hour offset keeps
# the two data commits from racing). The archived series are daily:
# each run fetches the full daily history from the free providers
# (Yahoo Finance chart API for prices, FRED fredgraph for macro/vol,
# the FEDS Notes file for the excess bond premium — no paid feeds) and
# merges it incrementally, so the fingerprint windows (21 sessions) and
# the dated inflection points (e.g. the vol-curve flip) compute from
# daily closes exactly as defined — only the refresh cadence is
# weekly.
#
# Failure policy (the pulse policy): a series that fails marks its
# entry "error" in _meta.json but does not fail the run; last good
# archived data is kept and the states read the archive. The run is
# logged as a GitHub issue either way.

name: Weekly pulse-of-the-market update

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-momentum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install polars

      - name: Refresh pulse-of-the-market data (incremental)
        run: python3 -m src.momentum.build_momentum --incremental

      - name: Run momentum tests
        run: python3 tests/test_momentum.py

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/momentum/ docs/data/momentum.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Weekly pulse-of-the-market update: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Log run as issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Weekly pulse-of-the-market refresh completed.';
            try {
              const meta = JSON.parse(fs.readFileSync('data/momentum/_meta.json', 'utf8'));
              const lines = Object.entries(meta.indicators).map(([k, v]) =>
                `- ${k}: ${v.status}${v.last_observation ? ` (last ${v.last_observation})` : ''}${v.error ? ` — ${v.error}` : ''}`);
              body = `**${meta.n_live}/${meta.n_indicators} live**, ${meta.n_pending} pending, ${meta.n_error} errors.\n\n${lines.join('\n')}`;
            } catch (e) { body = 'Could not read _meta.json: ' + e.message; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Weekly pulse-of-the-market update ${new Date().toISOString().slice(0, 10)}`,
              body,
            });
