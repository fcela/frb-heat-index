name: Quarterly data update

on:
  schedule:
    - cron: "30 7 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check for newly released quarters
        id: updater
        run: |
          python .github/scripts/update.py \
            --report "${{ runner.temp }}/update-report.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish the validated release
        if: steps.updater.outputs.run_status == 'published'
        env:
          NEW_QUARTERS: ${{ steps.updater.outputs.new_quarters }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Quarterly data update $NEW_QUARTERS"
          git push

      - name: Report release status
        if: always()
        run: |
          if test -f "${{ runner.temp }}/update-report.md"; then
            cat "${{ runner.temp }}/update-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
