name: hf-weekly-nowcast

# Weekly refresh of the hedge-fund leverage nowcast live layer
# (src/hf_nowcast.py). Vintage = the preceding Friday. This workflow is
# independent of the quarterly pipeline and of pulse: it writes only
# the HF nowcast bundle and its vintage log.

on:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hf-nowcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install polars numpy
      - name: Run the weekly nowcast
        run: python src/hf_nowcast.py
      - name: Commit the bundle and vintage log if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/hf_nowcast.json data/hf_nowcast_vintages.csv
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Weekly HF nowcast refresh"
            git push
          fi
